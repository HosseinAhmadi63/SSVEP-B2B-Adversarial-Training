[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ssvep-b2b"
version = "1.0.0"
description = "Paper-faithful reproduction pipeline for adversarial training on SSVEP EEG"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
  {name = "Hossein Ahmadi"},
  {name = "Ali Kuhestani"},
  {name = "Mohammadreza Keshavarzi"},
  {name = "Luca Mesin"}
]
dependencies = [
  "h5py==3.14.0",
  "matplotlib==3.10.3",
  "mne==1.10.1",
  "moabb==1.4.3",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pyriemann==0.12",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
  "scipy==1.15.3",
  "seaborn==0.13.2",
  "torch==2.7.1",
  "tqdm==4.67.1"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-cov==6.1.1",
  "ruff==0.11.13"
]

[project.scripts]
ssvep-b2b = "ssvep_b2b.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssvep_b2b = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
