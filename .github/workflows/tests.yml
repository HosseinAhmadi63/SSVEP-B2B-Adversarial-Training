name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
      - name: Verify paper transcription
        run: python -m ssvep_b2b.cli verify-paper --config configs/paper.yaml
      - name: Run synthetic smoke check
        run: python -m ssvep_b2b.cli smoke --config configs/paper.yaml
